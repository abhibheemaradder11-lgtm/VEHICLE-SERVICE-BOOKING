<!DOCTYPE html>
<html>
<head>
    <title>Book Service | Elite AutoCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&q=80&w=1600'); background-size: cover; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 20px; width: 100%; max-width: 480px; }
    </style>
</head>
<body>
    <div class="card shadow">
        <h3 class="text-center mb-4">Elite AutoCare Booking</h3>
        <form action="/book" method="POST">
            <input type="text" name="name" class="form-control mb-3" placeholder="Full Name" required>
            <input type="tel" name="contact" class="form-control mb-3" placeholder="Phone Number (10 Digits)" pattern="[0-9]{10}" maxlength="10" minlength="10" required>
            
            <select name="v_type" class="form-select mb-3">
                <option value="Two Wheeler">Two Wheeler 🏍️</option>
                <option value="Four Wheeler">Four Wheeler 🚗</option>
            </select>
            
            <select name="service" class="form-select mb-3">
                <option value="General Service">General Service</option>
                <option value="Full Body Wash">Full Body Wash</option>
                <option value="Oil & Filter Change">Oil & Filter Change</option>
                <option value="Brake Overhauling">Brake Overhauling</option>
                <option value="Engine Tuning">Engine Tuning</option>
                <option value="Wheel Alignment">Wheel Alignment</option>
                <option value="AC Servicing">AC Servicing</option>
            </select>
            
            <select name="slot" class="form-select mb-3">
                <option>09:00 AM - 11:00 AM</option>
                <option>11:00 AM - 01:00 PM</option>
                <option>02:00 PM - 04:00 PM</option>
                <option>04:00 PM - 06:00 PM</option>
            </select>
            
            <button type="submit" class="btn btn-danger w-100 mb-3">Confirm Booking</button>
            <div class="text-center"><a href="/" class="text-decoration-none">← Go to Home</a></div>
        </form>
    </div>
</body>
</html>
