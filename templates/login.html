<!DOCTYPE html>
<html>
<head>
    <title>Admin Login | Elite AutoCare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1486006396193-c81d39a31a91?auto=format&fit=crop&q=80&w=1600');
            background-size: cover; height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card { 
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); 
            padding: 50px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.2);
            width: 100%; max-width: 400px; text-align: center; color: white;
        }
        input { 
            width: 100%; padding: 15px; margin: 12px 0; border-radius: 8px; 
            border: none; background: rgba(255,255,255,0.95); color: #333;
        }
        button { 
            width: 100%; padding: 15px; background: #ff4757; color: white; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }
        .error { color: #ff4757; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-card animate__animated animate__fadeInUp">
        <h2 style="letter-spacing: 3px;">ADMIN LOGIN</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">LOGIN</button>
        </form>
        <a href="/" style="color: white; display: block; margin-top: 20px; text-decoration: none; opacity: 0.7;">← Back to Home</a>
    </div>
</body>
</html>
