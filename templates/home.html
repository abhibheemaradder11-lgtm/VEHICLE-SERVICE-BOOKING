<!DOCTYPE html>
<html>
<head>
    <title>Elite AutoCare | Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&q=80&w=1600');
            background-size: cover; background-position: center; background-attachment: fixed;
            height: 100vh; display: flex; flex-direction: column; color: white; overflow: hidden;
        }
        .navbar {
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
            padding: 20px 60px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .nav-logo { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; }
        .nav-links a {
            color: white; text-decoration: none; margin-left: 35px;
            font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        .nav-links a:hover { color: #ff4757; }
        .main-hero { flex-grow: 1; display: flex; align-items: center; justify-content: center; }
        .hero-card { 
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); 
            padding: 70px; border-radius: 40px; text-align: center; 
            border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 25px 60px rgba(0,0,0,0.7);
        }
        h1 { font-size: 4.5rem; margin: 0; font-weight: 900; letter-spacing: 2px; }
        .subtitle { font-size: 1.2rem; color: #f1f1f1; margin-bottom: 45px; letter-spacing: 5px; font-weight: 300; text-transform: uppercase; }
        .btn-book { 
            background: #ff4757; color: white; padding: 18px 50px; border-radius: 50px; 
            text-decoration: none; font-weight: bold; transition: 0.4s; font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar animate__animated animate__fadeInDown">
        <div class="nav-logo">ELITE AUTOCARE</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/book">Booking</a>
            <a href="/dashboard">Dashboard</a>
            {% if session.admin_logged_in %}
                <a href="/logout" style="color: #ff4757;">Logout</a>
            {% else %}
                <a href="/login">Login</a>
            {% endif %}
        </div>
    </nav>
    <div class="main-hero">
        <div class="hero-card animate__animated animate__zoomIn">
            <h1>ELITE AUTOCARE</h1>
            <div class="subtitle">Vehicle Booking System</div>
            <a href="/book" class="btn-book">NEW APPOINTMENT</a>
        </div>
    </div>
</body>
</html>
