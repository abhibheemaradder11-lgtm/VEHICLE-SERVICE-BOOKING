<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Service Booking</title>
    <style>
        body { font-family: Arial; margin: 40px; background-color: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 500px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Book Your Appointment</h2>
        <form action="/book" method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <select name="vehicle_type">
                <option value="Two Wheeler">Two Wheeler</option>
                <option value="Four Wheeler">Four Wheeler</option>
            </select>
            <input type="text" name="service" placeholder="Service Needed (e.g., Oil Change)" required>
            <input type="date" name="date" required>
            <input type="time" name="time" required>
            <button type="submit">Confirm Booking</button>
        </form>
    </div>
</body>
</html>
